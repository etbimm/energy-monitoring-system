4" r="14" fill="#FFFFFF" stroke="#0B3D6E" stroke-width="2.2"/><line x1="1400" y1="568" x2="1400" y2="606" stroke="#0B3D6E" stroke-width="2.2" fill="none" stroke-linecap="round"/><line x1="1376" y1="580" x2="1424" y2="580" stroke="#0B3D6E" stroke-width="2.2" fill="none" stroke-linecap="round"/><line x1="1400" y1="606" x2="1380" y2="636" stroke="#0B3D6E" stroke-width="2.2" fill="none" stroke-linecap="round"/><line x1="1400" y1="606" x2="1420" y2="636" stroke="#0B3D6E" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="1400.0" y="654.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0B3D6E">Admin</text><text x="1400.0" y="672.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#5A6B7D">(mengelola sistem)</text><rect x="40" y="1059" width="1420" height="126" rx="6" fill="#FFFBEA" stroke="#D3A52C" stroke-width="1"/><text x="56.0" y="1078.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#33475B">Catatan:</text><text x="56.0" y="1100.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#33475B">1. Semua use case selain Login mensyaratkan sesi login (JWT di cookie httpOnly). Tanpa login, halaman dialihkan ke /login.</text><text x="56.0" y="1122.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#33475B">2. Admin mewarisi seluruh use case Viewer (generalisasi). Batasan diterapkan di backend (401/403), menu admin hanya disembunyikan di frontend.</text><text x="56.0" y="1144.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#33475B">3. Admin tidak dapat menurunkan role, menonaktifkan, atau menghapus akunnya sendiri; minimal satu admin aktif harus tetap ada.</text><text x="56.0" y="1166.0" text-anchor="start" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#33475B">4. Admin pertama dibuat lewat CLI server: python -m app.cli create-admin (tidak ada registrasi publik).</text></svg>